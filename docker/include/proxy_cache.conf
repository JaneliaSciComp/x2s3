proxy_cache mycache;

proxy_cache_valid 200 302 15m;
proxy_cache_valid 404     1m;

# GET and HEAD are cached by default
proxy_cache_methods GET HEAD;

# Do not convert HEAD into GET
proxy_cache_convert_head off;

# Since head conversion is disabled, the request_method is included in the proxy_cache_key
proxy_cache_key  "$scheme$proxy_host$request_method$request_uri$is_args$args";

# Lock the cache so that only one request can populate it at a time
proxy_cache_lock    on;
proxy_cache_revalidate on;

# Range requests must bypass the cache AND keep their Range header.
#
# Because proxy_cache is configured here, nginx strips Range/If-Range from the
# upstream request so it can store whole objects. That is decided at config
# time, so proxy_cache_bypass/proxy_no_cache do NOT restore it -- the two must
# go together. Without the proxy_set_header lines below, a 16 KB zarr3
# inner-chunk read off a 743 MB shard makes nginx fetch the whole shard and
# discard everything before the requested offset, so latency scales with the
# offset: measured 42ms at 1 MB, 2.7s at 200 MB, 4.6s at 700 MB. With them,
# all three are ~10ms.
#
# Ranged responses must still stay out of the cache: proxy_cache_key has no
# Range in it, so caching a 206 would serve those bytes for every other range
# of the same object. Unranged GETs (zarr.json, bucket listings) still cache.
proxy_cache_bypass $http_range;
proxy_no_cache     $http_range;
proxy_set_header   Range    $http_range;
proxy_set_header   If-Range $http_if_range;

# Set back a nice HTTP Header to indicate what the cache status was
add_header X-Proxy-Cache $upstream_cache_status;

