proxy_cache mycache;

proxy_cache_valid 200 302 15m;
proxy_cache_valid 404     1m;

# GET and HEAD are cached by default
proxy_cache_methods GET HEAD;

# Do not convert HEAD into GET
proxy_cache_convert_head off;

# Since head conversion is disabled, the request_method is included in the proxy_cache_key
proxy_cache_key  "$scheme$proxy_host$request_method$request_uri$is_args$args";

# Lock the cache so that only one request can populate it at a time
proxy_cache_lock    on;
proxy_cache_revalidate on;

# Never cache range requests. The cache stores whole objects, so a miss on a
# ranged GET makes nginx drop the Range and fetch the entire object upstream:
# a 16 KB zarr3 inner-chunk read off a 718 MB shard pulled all 718 MB. Since
# proxy_cache_key ignores Range, every concurrent read of that shard then
# blocks on proxy_cache_lock until the fill finishes or lock_timeout expires,
# which is what made Neuroglancer crawl. Unranged GETs still cache normally.
proxy_cache_bypass $http_range;
proxy_no_cache     $http_range;

# Set back a nice HTTP Header to indicate what the cache status was
add_header X-Proxy-Cache $upstream_cache_status;

